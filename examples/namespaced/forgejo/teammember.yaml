apiVersion: forgejo.forgejo.m.crossplane.io/v1alpha1
kind: TeamMember
metadata:
  annotations:
    meta.upbound.io/example-id: forgejo/v1alpha1/teammember
  labels:
    testing.upbound.io/example-name: membership
  name: membership
  namespace: default
spec:
  forProvider:
    teamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: team
    userSelector:
      matchLabels:
        testing.upbound.io/example-name: test

---

apiVersion: forgejo.forgejo.m.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: forgejo/v1alpha1/teammember
  labels:
    testing.upbound.io/example-name: owner
  name: owner
  namespace: default
spec:
  forProvider: {}

---

apiVersion: forgejo.forgejo.m.crossplane.io/v1alpha1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: forgejo/v1alpha1/teammember
  labels:
    testing.upbound.io/example-name: team
  name: team
  namespace: default
spec:
  forProvider:
    organizationId: ${forgejo_organization.owner.id}
    unitsMap:
      repo.code: read

---

apiVersion: forgejo.forgejo.m.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: forgejo/v1alpha1/teammember
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: default
spec:
  forProvider:
    email: test_user@localhost.localdomain
    passwordSecretRef:
      key: example-key
      name: example-secret
