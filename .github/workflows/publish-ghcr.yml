# Build the provider (patched svalabs TF + controller) and publish the
# Crossplane xpkg to GitHub Container Registry.
#
# Images land at:
#   ghcr.io/<github.repository_owner>/provider-forgejo:<version>
#
# Triggers:
#   - push of tags matching v* (e.g. v0.2.13)
#   - workflow_dispatch with optional version override
#
# All third-party actions are pinned by commit SHA.

name: Publish to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v0.2.13). Empty = git describe / tag.'
        required: false
        default: ''

env:
  DOCKER_BUILDX_VERSION: 'v0.34.1'
  # Override scaffold defaults (ghcr.io/crossplane-contrib) for this fork.
  REGISTRY_ORG: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="$(git describe --tags --always --dirty)"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Publishing VERSION=${V}"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> "$GITHUB_OUTPUT"

      - name: Cache the Go Build Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-publish-ghcr-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-publish-ghcr-

      - name: Cache Go Dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      # Runtime image ADD requires the patched svalabs plugin (stock zip is overwritten).
      - name: Build patched svalabs TF provider (linux/amd64)
        run: ./hack/build-patched-tf-provider.sh

      - name: Build and publish xpkg to GHCR
        env:
          BUILD_ARGS: '--load'
        run: |
          ORG="${{ env.REGISTRY_ORG }}"
          VER="${{ steps.ver.outputs.version }}"
          make -j2 \
            XPKG_REG_ORGS="${ORG}" \
            XPKG_REG_ORGS_NO_PROMOTE="${ORG}" \
            REGISTRY_ORGS="${ORG}" \
            BRANCH_NAME=main \
            VERSION="${VER}" \
            build.all publish

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository_owner }}/provider-forgejo:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
