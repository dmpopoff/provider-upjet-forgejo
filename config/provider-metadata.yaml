        importStatements: []
    forgejo_repository_webhook:
        subCategory: ""
        description: Forgejo repository webhook resource.
        name: forgejo_repository_webhook
        title: forgejo_repository_webhook Resource - forgejo
        examples:
            - name: example
              manifest: |-
                {
                  "authorization_header": "Bearer token123456",
                  "branch_filter": "*",
                  "config": {
                    "content_type": "json",
                    "secret": "supersecret",
                    "url": "http://example.com/invoke"
                  },
                  "events": [
                    "push"
                  ],
                  "repository_id": "${forgejo_repository.personal.id}",
                  "type": "forgejo"
                }
              references:
                repository_id: forgejo_repository.personal.id
              dependencies:
                forgejo_repository.personal: |-
                    {
                      "name": "personal_test_repo"
                    }
        argumentDocs:
            active: (Boolean) Boolean indicating if the webhook is active.
            authorization_header: (String, Sensitive) Authorization header to send to the target.
            branch_filter: (String) List of allowed branches for push, branch creation and branch deletion events, specified as glob pattern. If empty or *, events for all branches are reported.
            config: '(Map of String) Map of configuration settings, e.g. "content_type" and "url". The "secret" key is write-only: Forgejo accepts it on create/update but never returns it, so the provider preserves the configured value instead of reading it back, and cannot detect changes made outside of Terraform.'
            created_at: (String) Time at which the webhook was created.
            events: (Set of String) List of events which trigger the webhook.
            repository_id: (Number) Numeric identifier of the repository. Changing this forces a new resource to be created.
            type: (String) Type of webhook. Changing this forces a new resource to be created.
            updated_at: (String) Time at which the webhook was updated.
            webhook_id: (Number) Numeric identifier of the webhook.
        importStatements:
            - |-
              # Import using the repo_owner/repo_name/webhook_id.
              terraform import forgejo_repository_webhook.example tfadmin/personal_test_repo/123
    forgejo_ssh_key:
        subCategory: ""
        description: 'Forgejo user SSH key resource. Note: Managing user SSH keys requires administrative privileges!'
        name: forgejo_ssh_key
        title: forgejo_ssh_key Resource - forgejo
        examples:
            - name: this
              manifest: |-
                {
                  "key": "${trimspace(tls_private_key.ed25519.public_key_openssh)}",
                  "title": "test_key",
                  "user": "${forgejo_user.test.login}"
                }
              references:
                user: forgejo_user.test.login
              dependencies:
                forgejo_user.test: |-
                    {
                      "email": "test_user@localhost.localdomain",
                      "login": "test_user",
                      "password": "${var.test_password}"
                    }
                tls_private_key.ed25519: |-
                    {
                      "algorithm": "ED25519"
                    }
        argumentDocs:
            created_at: (String) Time at which the SSH key was created.
            fingerprint: (String) Fingerprint of the SSH key.
            key: (String) Armored SSH key. Trailing newlines must be removed (e.g. using trimspace() function). Changing this forces a new resource to be created.
            key_id: (Number) Numeric identifier of the SSH key.
            key_type: (String) Type of the SSH key.
            read_only: (Boolean) Does the key have only read access?
            title: (String) Title of the SSH key. Changing this forces a new resource to be created.
            url: (String) URL of the SSH key.
            user: (String) Name of the user. Changing this forces a new resource to be created.
        importStatements: []
    forgejo_team:
        subCategory: ""
        description: 'Forgejo team resource. Note: The authenticated user must be a member of the managed organization(s) or have administrative privileges!'
        name: forgejo_team
        title: forgejo_team Resource - forgejo
        examples:
            - name: default_team
              manifest: |-
                {
                  "name": "org_test_team_defaults",
                  "organization_id": "${forgejo_organization.owner.id}",
                  "units_map": {
                    "repo.code": "read"
                  }
                }
              references:
                organization_id: forgejo_organization.owner.id
              dependencies:
                forgejo_organization.owner: |-
                    {
                      "name": "test_org"
                    }
            - name: custom_team
              manifest: |-
                {
                  "can_create_org_repo": true,
                  "description": "A team with non-default parameters.",
                  "includes_all_repositories": true,
                  "name": "org_test_team_non_defaults",
                  "organization_id": "${forgejo_organization.owner.id}",
                  "permission": "read",
                  "units_map": {
                    "repo.code": "read",
                    "repo.issues": "write",
                    "repo.pulls": "read"
                  }
                }
              references:
                organization_id: forgejo_organization.owner.id
              dependencies:
                forgejo_organization.owner: |-
                    {
                      "name": "test_org"
                    }
        argumentDocs:
            can_create_org_repo: (Boolean) Can create repositories?
            description: (String) Description of the team.
            id: (Number) Numeric identifier of the team.
            includes_all_repositories: (Boolean) Has access to all repositories?
            name: (String) Name of the team.
            organization: '(String) Name of the owning organization. Changing this forces a new resource to be created. Note: One of organization or organization_id must be specified.'
            organization_id: '(Number) Numeric identifier of the owning organization. Changing this forces a new resource to be created. Note: One of organization or organization_id must be specified.'
            permission: '(String) Permissions within the owning organization. Note: If you set admin or owner here, make sure to set the correct units_map.'
            units_map: '(Map of String) Map of access units. Note: If the permission is admin or owner all units must be set to admin as well.'
        importStatements:
            - |-
              # Import using the org_name/team.
              terraform import forgejo_team.default_team test_org/org_test_team_defaults
    forgejo_team_member:
        subCategory: ""
        description: Forgejo team member resource.
        name: forgejo_team_member
        title: forgejo_team_member Resource - forgejo
        examples:
            - name: membership
              manifest: |-
                {
                  "team_id": "${forgejo_team.team.id}",
                  "user": "${forgejo_user.test.login}"
