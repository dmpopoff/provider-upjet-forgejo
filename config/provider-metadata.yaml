                }
              references:
                repository_id: forgejo_repository.personal.id
              dependencies:
                forgejo_repository.personal: |-
                    {
                      "name": "personal_test_repo"
                    }
        argumentDocs:
            data: (String) Data of the variable.
            name: (String) Name of the variable.
