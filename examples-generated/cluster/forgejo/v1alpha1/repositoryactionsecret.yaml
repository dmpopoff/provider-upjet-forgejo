apiVersion: forgejo.forgejo.crossplane.io/v1alpha1
kind: RepositoryActionSecret
metadata:
  annotations:
    meta.upbound.io/example-id: forgejo/v1alpha1/repositoryactionsecret
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    dataSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    name: my_secret
    repositoryIdSelector:
      matchLabels:
        testing.upbound.io/example-name: personal

---

apiVersion: forgejo.forgejo.crossplane.io/v1alpha1
kind: Repository
metadata:
  annotations:
    meta.upbound.io/example-id: forgejo/v1alpha1/repositoryactionsecret
  labels:
    testing.upbound.io/example-name: personal
  name: personal
spec:
  forProvider:
    name: personal_test_repo
